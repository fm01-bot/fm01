[project]
name = "fm01-migrations"
version = "0.1.0"
description = "Alembic migrations for the fm01 database"
requires-python = ">=3.12,<3.14"
license = "MIT"

dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.1.0",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.8",
    "testcontainers[postgres]>=4.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.format]
indent-style = "tab"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a throwaway PostgreSQL database (Docker)"]
