[project]
name = "fm01-schemas"
version = "0.1.0"
description = "Wire models shared by the fm01 bot, API and dashboard"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
indent-style = "tab"
