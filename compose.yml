services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-fm01}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Please set a database password in .env}
      POSTGRES_DB: ${DB_NAME:-fm01}
      DB_PORT: ${DB_PORT:-5432}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: -p ${DB_PORT:-5432}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-fm01} -p ${DB_PORT:-5432}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    restart: unless-stopped
    environment:
      _JAVA_OPTIONS: -Xmx512M -Duser.language=en -Duser.country=US
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?Please set a Lavalink password in .env}
      LAVALINK_URI: ${LAVALINK_URI:-http://lavalink:2333}
    volumes:
      - ./services/lavalink/application.yml:/opt/Lavalink/application.yml:ro
    ports:
      - "127.0.0.1:2333:2333"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- --header=\"Authorization: ${LAVALINK_PASSWORD}\" http://localhost:2333/version || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Self-hosted RSSHub: the TikTok alert feed source (the public rsshub.app blocks bots).
  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/2
    ports:
      - "127.0.0.1:1200:1200"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:1200/healthz" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Self-hosted cobalt: resolves and downloads media for the download command. No port is published, so only
  # services on the Compose network (the bot) can reach it. Every request comes from the bot's one address, so the
  # per-IP rate limits are raised well above cobalt's defaults.
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    restart: unless-stopped
    read_only: true
    environment:
      # Tunnel links are built from this, so it must be the address the bot reaches cobalt at.
      API_URL: http://cobalt:9000/
      RATELIMIT_MAX: ${COBALT_RATELIMIT_MAX:-600}
      TUNNEL_RATELIMIT_MAX: ${COBALT_RATELIMIT_MAX:-600}

  twilight-proxy:
    image: ghcr.io/twilight-rs/http-proxy:latest
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${TOKEN:?Please set a bot token in .env}
    ports:
      - "127.0.0.1:3000:3000"
    profiles:
      - clustered

  # Holds the Discord gateway connections so the bot can restart without reconnecting its shards.
  # Pinned by digest; `just deploy-proxy` is the only routine that recreates it.
  gateway-proxy:
    image: ghcr.io/gelbpunkt/gateway-proxy:znver3@sha256:f130920b108fbc3a27ad0c75eee4174acf627802920daf75bc4b6a3f1d77995c
    restart: unless-stopped
    environment:
      TOKEN: ${TOKEN:?Please set a bot token in .env}
    volumes:
      - ./services/gateway-proxy/config.json:/config.json:ro
    ports:
      - "127.0.0.1:7878:7878"
    profiles:
      - gateway-proxy

  # One-shot: applies pending Alembic migrations (the API's schema), then exits. The API and bot wait for it.
  migrations:
    build: ./services/migrations/
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Please set a database password in .env}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-fm01}
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-fm01}

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Please set a database password in .env}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-fm01}
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-fm01}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:?Please set an internal API token in .env}
      TOKEN: ${TOKEN:?Please set a bot token in .env}
      # Dashboard sign-in; leave unset to run without the dashboard.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  bot:
    build:
      context: .
      dockerfile: services/bot/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      lavalink:
        condition: service_healthy
      redis:
        condition: service_healthy
      rsshub:
        condition: service_started
      cobalt:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-http://api:8000}
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:?Please set an internal API token in .env}
      TOKEN: ${TOKEN:?Please set a bot token in .env}
      DEBUG_TOKEN: ${DEBUG_TOKEN}
      DB_PASSWORD: ${DB_PASSWORD:?Please set a database password in .env}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-fm01}
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-fm01}
      LAVALINK_URI: ${LAVALINK_URI:-http://lavalink:2333}
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN:-}
      BOT_MODE: ${BOT_MODE:-standalone}
      SHARD_COUNT: ${SHARD_COUNT:-}
      SHARDS_PER_CLUSTER: ${SHARDS_PER_CLUSTER:-16}
      CLUSTER_ID: ${CLUSTER_ID:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_MSG_URL: ${REDIS_MSG_URL:-redis://redis:6379/1}
      DISCORD_PROXY_URL: ${DISCORD_PROXY_URL:-}
      DISCORD_GATEWAY_URL: ${DISCORD_GATEWAY_URL:-}
      RSSHUB_URL: ${RSSHUB_URL:-http://rsshub:1200}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      COBALT_URL: ${COBALT_URL:-http://cobalt:9000}
      COBALT_API_KEY: ${COBALT_API_KEY:-}
    volumes:
      # Mirrors the repository layout, as the image does: the bot resolves localizations and schemas at ../../shared.
      - ./services/bot:/fm01/services/bot
      - ./shared:/fm01/shared:ro

volumes:
  postgres_data:
