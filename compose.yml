services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-fm01}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Please set a database password in .env}
      POSTGRES_DB: ${DB_NAME:-fm01}
      DB_PORT: ${DB_PORT:-5432}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: -p ${DB_PORT:-5432}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-fm01} -p ${DB_PORT:-5432}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    restart: unless-stopped
    environment:
      _JAVA_OPTIONS: -Xmx512M -Duser.language=en -Duser.country=US
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?Please set a Lavalink password in .env}
      LAVALINK_URI: ${LAVALINK_URI:-http://lavalink:2333}
    volumes:
      - ./services/lavalink/application.yml:/opt/Lavalink/application.yml:ro
    ports:
      - "127.0.0.1:2333:2333"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- --header=\"Authorization: ${LAVALINK_PASSWORD}\" http://localhost:2333/version || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Self-hosted RSSHub: the TikTok alert feed source (the public rsshub.app blocks bots).
  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/2
    ports:
      - "127.0.0.1:1200:1200"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:1200/healthz" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  twilight-proxy:
    image: ghcr.io/twilight-rs/http-proxy:latest
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${TOKEN:?Please set a bot token in .env}
    ports:
      - "127.0.0.1:3000:3000"
    profiles:
      - clustered

  # Holds the Discord gateway connections so the bot can restart without reconnecting its shards.
  # Pinned by digest; `just deploy-proxy` is the only routine that recreates it.
  gateway-proxy:
    image: ghcr.io/gelbpunkt/gateway-proxy:znver3@sha256:f130920b108fbc3a27ad0c75eee4174acf627802920daf75bc4b6a3f1d77995c
    restart: unless-stopped
    environment:
      TOKEN: ${TOKEN:?Please set a bot token in .env}
    volumes:
      - ./services/gateway-proxy/config.json:/config.json:ro
    ports:
      - "127.0.0.1:7878:7878"
    profiles:
      - gateway-proxy

  # One-shot: applies pending Alembic migrations, then exits. The bot waits for a successful exit.
  migrations:
    build: ./services/migrations/
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Please set a database password in .env}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-fm01}
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-fm01}

  bot:
    build: ./services/bot/
    depends_on:
      db:
        condition: service_healthy
      lavalink:
        condition: service_healthy
      redis:
        condition: service_healthy
      rsshub:
        condition: service_started
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      TOKEN: ${TOKEN:?Please set a bot token in .env}
      DEBUG_TOKEN: ${DEBUG_TOKEN}
      DB_PASSWORD: ${DB_PASSWORD:?Please set a database password in .env}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-fm01}
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-fm01}
      LAVALINK_URI: ${LAVALINK_URI:-http://lavalink:2333}
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN:-}
      BOT_MODE: ${BOT_MODE:-standalone}
      SHARD_COUNT: ${SHARD_COUNT:-}
      SHARDS_PER_CLUSTER: ${SHARDS_PER_CLUSTER:-16}
      CLUSTER_ID: ${CLUSTER_ID:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_MSG_URL: ${REDIS_MSG_URL:-redis://redis:6379/1}
      DISCORD_PROXY_URL: ${DISCORD_PROXY_URL:-}
      DISCORD_GATEWAY_URL: ${DISCORD_GATEWAY_URL:-}
      RSSHUB_URL: ${RSSHUB_URL:-http://rsshub:1200}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
    volumes:
      - ./services/bot:/bot
      # The bot resolves localizations to /shared/localization (../../shared from /bot).
      - ./shared:/shared:ro

  # The public website. Opt-in (COMPOSE_PROFILES=website): self-hosters running only the bot don't need it.
  # Built from the repo root so it can read shared/; text is baked in at build time, so rebuild after locale changes.
  website:
    build:
      context: .
      dockerfile: services/website/Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3007
    ports:
      - "127.0.0.1:${WEBSITE_PORT:-3007}:3007"
    profiles:
      - website

volumes:
  postgres_data:
