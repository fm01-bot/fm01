name: Ruff formatting

on:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bot

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
          working-directory: services/bot

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Format
        run: uv run ruff format .

      - name: Auto-commit
        # Through env, not ${{ }} in the script: a branch name is user input and would run as shell code.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ `git status --porcelain` ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "🤖 chore: auto-format code using ruff"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/${REF_NAME}"
          else
            echo "Code was formatted successfully"
          fi
