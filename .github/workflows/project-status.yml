# Moves an issue's card on the project board as work on it starts.
#
#   branch created for issue #123  ->  Status "In progress"
#   pull request opened for #123   ->  Status "In review"
#
# The issue number comes from the branch name (`123-title`, `feat/123-title`),
# and for pull requests also from closing keywords in the body ("Closes #123").
# Cards only ever move forward: a branch created for an issue that is already
# "In review" or "Done" leaves it where it is. Moving to "Done" is left to the
# project's built-in "Item closed" workflow.
#
# The default GITHUB_TOKEN cannot edit organization projects, so this needs a
# PROJECT_TOKEN secret: a token with read/write access to the org's projects
# and read access to this repo's issues and pull requests.
#
# pull_request_target is used so PRs from forks are covered too. It never
# checks out or runs code from the PR.

name: Project board status

on:
  create:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions: {}

concurrency:
  group: project-status-${{ github.event.ref || github.event.pull_request.head.ref }}

env:
  PROJECT_OWNER: fm01-bot
  PROJECT_NUMBER: 3

jobs:
  move-card:
    name: Move issue card
    if: github.event_name == 'pull_request_target' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Update project status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // Board columns in order. Cards are never moved backwards.
            const ORDER = ["Backlog", "Ready", "In progress", "In review", "Done"];

            const isPR = context.eventName === "pull_request_target";
            const pr = context.payload.pull_request;
            const branch = isPR ? pr.head.ref : context.payload.ref;
            const target = isPR ? (pr.draft ? "In progress" : "In review") : "In progress";

            const numbers = new Set();
            const fromBranch = branch.match(/^(?:[\w.-]+\/)?(\d+)(?:[-_/]|$)/);
            if (fromBranch) numbers.add(Number(fromBranch[1]));
            if (isPR) {
              const keyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
              for (const m of (pr.body ?? "").matchAll(keyword)) numbers.add(Number(m[1]));
            }
            if (numbers.size === 0) {
              core.info(`No issue number in branch "${branch}"${isPR ? " or PR body" : ""}.`);
              return;
            }

            const { organization: { projectV2: project } } = await github.graphql(
              `query($owner: String!, $number: Int!) {
                organization(login: $owner) {
                  projectV2(number: $number) {
                    id
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField { id options { id name } }
                    }
                  }
                }
              }`,
              { owner: process.env.PROJECT_OWNER, number: Number(process.env.PROJECT_NUMBER) },
            );
            const status = project.field;
            const option = status.options.find((o) => o.name === target);
            if (!option) {
              core.setFailed(`The project has no "${target}" status.`);
              return;
            }

            for (const number of numbers) {
              const { repository } = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issueOrPullRequest(number: $number) {
                      __typename
                      ... on Issue {
                        id
                        state
                        projectItems(first: 20) {
                          nodes {
                            id
                            project { id }
                            fieldValueByName(name: "Status") {
                              ... on ProjectV2ItemFieldSingleSelectValue { name }
                            }
                          }
                        }
                      }
                    }
                  }
                }`,
                { ...context.repo, number },
              );
              const issue = repository.issueOrPullRequest;
              if (!issue || issue.__typename !== "Issue") {
                core.info(`#${number} is not an issue, skipping.`);
                continue;
              }
              if (issue.state !== "OPEN") {
                core.info(`#${number} is closed, skipping.`);
                continue;
              }

              let item = issue.projectItems.nodes.find((i) => i.project.id === project.id);
              if (!item) {
                const added = await github.graphql(
                  `mutation($project: ID!, $content: ID!) {
                    addProjectV2ItemById(input: { projectId: $project, contentId: $content }) {
                      item { id }
                    }
                  }`,
                  { project: project.id, content: issue.id },
                );
                item = { id: added.addProjectV2ItemById.item.id, fieldValueByName: null };
                core.info(`Added #${number} to the project.`);
              }

              const current = item.fieldValueByName?.name ?? null;
              if (current && ORDER.indexOf(current) >= ORDER.indexOf(target)) {
                core.info(`#${number} is already "${current}", leaving it.`);
                continue;
              }

              await github.graphql(
                `mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project, itemId: $item, fieldId: $field,
                    value: { singleSelectOptionId: $option }
                  }) { projectV2Item { id } }
                }`,
                { project: project.id, item: item.id, field: status.id, option: option.id },
              );
              core.info(`Moved #${number} from "${current ?? "no status"}" to "${target}".`);
            }
