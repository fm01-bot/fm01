name: Code quality checks

on:
  pull_request:
    branches:
      - main
    paths:
      - services/bot/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-compile:
    name: Lint, format & compile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
          working-directory: services/bot

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Verify Ruff formatting
        run: uv run ruff format --check .

      - name: Verify syntax and compilation
        run: uv run python -m compileall -q core cogs helpers args tests
