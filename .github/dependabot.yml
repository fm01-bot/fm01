# Dependency and image updates: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "uv"
    directories: ["/services/api", "/services/bot", "/services/migrations"]
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/services/website"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directories: ["/services/api", "/services/bot", "/services/migrations", "/services/website"]
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
